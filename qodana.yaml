# Qodana configuration for jol-compliance
# JetBrains Qodana — https://www.jetbrains.com/help/qodana/
# Linter: Community (free) — Markdown, YAML, shell script analysis
version: "1.0"

image: jetbrains/qodana-python-community:2024.3

profile:
  name: qodana.recommended

# Set up a Python virtual environment so Qodana can resolve the interpreter
# and install tooling used during analysis.
bootstrap: |
  python3 -m venv .venv
  . .venv/bin/activate
  pip install --quiet -r requirements.txt yamllint markdownlint-cli2 2>/dev/null || true

include:
  - name: YAMLLint
  - name: CheckShellScript
  - name: MarkdownInspection

exclude:
  - name: All
    paths:
      - .idea
      - .git
      - "**/*.xlsx"
      - "**/_ARCHIVED_*"

# Quality gate: fail if any CRITICAL issue found
failThreshold: 1