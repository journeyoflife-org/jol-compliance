name: Compliance Lint

# R1 2026-09-16: Disabled — QODANA_TOKEN declined by Qodana Cloud server
# (expired or revoked). Re-enable after rotating the token in repo secrets.
# The compliance-lint.yml workflow (ruff + bandit) covers CI lint in the
# meantime and produces the check required by legacy ruleset 18733439.
on:
  workflow_dispatch:

# Original triggers (restore after token rotation):
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]

permissions:
  contents: read

jobs:
  qodana-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run Qodana Scan
uses: JetBrains/qodana-action@f5aa2889b113c16bd6aee47817b027537ee33ac7  # v2025.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
