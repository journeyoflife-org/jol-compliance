# JOL Automated Evidence Collection
# =====================================
# Periodically collects and validates audit evidence across all frameworks.
# Generates evidence manifests and alerts on gaps.
#
# Document ID: JOL-WF-EC-001
# Owner: DevOps Lead

name: Evidence Collection

on:
  schedule:
    # Run monthly on the 1st at 05:00 UTC (also covers quarterly: Jan, Apr, Jul, Oct)
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      framework:
        description: "Framework to collect (all, iso27001, soc2, gdpr, security-policies)"
        required: false
        default: "all"
      notify:
        description: "Send notification on gaps (true/false)"
        required: false
        default: "true"

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.12"
  EVIDENCE_BRANCH: "evidence-collection"

jobs:
  # ── Collect Evidence ───────────────────────────────────────────────────
  collect:
    name: Collect and Validate Evidence
    runs-on: ubuntu-latest
    outputs:
      completeness: ${{ steps.collect.outputs.completeness }}
      missing_count: ${{ steps.collect.outputs.missing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Run evidence collector
        id: collect
        run: |
          FRAMEWORK="${{ github.event.inputs.framework || 'all' }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "=== Evidence Collection Run ==="
          echo "Framework: $FRAMEWORK"
          echo "Timestamp: $TIMESTAMP"
          echo ""

          # Run collector
          python scripts/evidence_collector.py \
            --framework "$FRAMEWORK" \
            --output "./evidence-export" \
            2>&1 | tee evidence-output.txt

          # Extract metrics from output
          COMPLETENESS=$(grep "Completeness:" evidence-output.txt | grep -oP '[\d.]+%' | head -1 || echo "N/A")
          MISSING=$(grep "Missing:" evidence-output.txt | grep -oP '\d+' | head -1 || echo "0")

          echo "completeness=$COMPLETENESS" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Validate evidence manifest
        run: |
          if [ -f evidence-export/evidence-manifest.json ]; then
            echo "Evidence manifest generated successfully."
            python3 -c "
          import json
          with open('evidence-export/evidence-manifest.json') as f:
              manifest = json.load(f)
          print(f'Manifest ID: {manifest[\"manifest_id\"]}')
          print(f'Total items: {manifest[\"summary\"][\"total_items\"]}')
          print(f'Collected: {manifest[\"summary\"][\"collected\"]}')
          print(f'Missing: {manifest[\"summary\"][\"missing\"]}')
          print(f'Completeness: {manifest[\"summary\"][\"completeness_pct\"]}%')
          "
          else
            echo "::warning::No evidence manifest generated"
          fi

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-export-${{ github.run_id }}
          path: evidence-export/
          retention-days: 90

  # ── Git History Evidence ──────────────────────────────────────────────
  git-evidence:
    name: Git History Evidence Extraction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract git audit trail
        run: |
          echo "=== Git Audit Trail Evidence ==="
          echo ""
          echo "--- Commit Activity (Last 12 Months) ---"
          git log --since="12 months ago" --format="%h %ai %an %s" --stat > git-audit-trail.txt
          
          echo ""
          echo "--- Branch Protection Evidence ---"
          echo "Main branch commits:"
          git log --oneline main --since="12 months ago" 2>/dev/null | head -20 || echo "No main branch history"
          
          echo ""
          echo "--- Document Change Evidence ---"
          git log --since="12 months ago" --name-only --pretty=format:"%h %ai %an" -- "*.md" > doc-changes.txt
          
          echo ""
          echo "--- Policy Review Evidence ---"
          echo "Documents modified in the last 12 months:"
          cat doc-changes.txt | head -50

      - name: Upload git evidence
        uses: actions/upload-artifact@v4
        with:
          name: git-evidence-${{ github.run_id }}
          path: |
            git-audit-trail.txt
            doc-changes.txt
          retention-days: 90

  # ── Evidence Gap Analysis ─────────────────────────────────────────────
  gap-analysis:
    name: Evidence Gap Analysis
    needs: [collect]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Run gap analysis
        run: |
          python3 << 'GAP_ANALYSIS'
          import sys
          from pathlib import Path

          # Required evidence files by framework
          REQUIRED_EVIDENCE = {
              "ISO 27001": [
                  "iso27001/policies/information-security-policy.md",
                  "iso27001/risk-register/risk-register-2026.md",
                  "iso27001/soa/statement-of-applicability.md",
                  "iso27001/asset-register/asset-register.md",
                  "iso27001/internal-audits/internal-audit-template.md",
                  "iso27001/management-reviews/management-review-template.md",
              ],
              "SOC 2": [
                  "soc2/trust-services-criteria/tsc-control-mapping.md",
                  "soc2/evidence/cc6/access-control-evidence.md",
                  "soc2/evidence/cc7/system-operations-evidence.md",
                  "soc2/evidence/cc8/change-management-evidence.md",
                  "soc2/evidence/a1/availability-evidence.md",
                  "soc2/access-reviews/quarterly-access-review-template.md",
              ],
              "GDPR": [
                  "gdpr/privacy-policies/lt/privacy-policy-lt.md",
                  "gdpr/privacy-policies/lv/privacy-policy-lv.md",
                  "gdpr/privacy-policies/ee/privacy-policy-ee.md",
                  "gdpr/ropa/ropa-template.md",
                  "gdpr/dpias/dpia-template.md",
                  "gdpr/retention-policies/data-retention-policy.md",
                  "gdpr/dsr-procedures/data-subject-rights-procedure.md",
              ],
              "Security Policies": [
                  "security-policies/acceptable-use-policy.md",
                  "security-policies/password-policy.md",
                  "security-policies/incident-response-policy.md",
                  "security-policies/data-classification-policy.md",
                  "security-policies/encryption-policy.md",
                  "security-policies/backup-and-recovery-policy.md",
              ],
          }

          print("\n" + "=" * 60)
          print("  EVIDENCE GAP ANALYSIS")
          print("=" * 60)

          total_gaps = 0
          for framework, files in REQUIRED_EVIDENCE.items():
              gaps = [f for f in files if not Path(f).exists()]
              present = len(files) - len(gaps)
              print(f"\n  {framework}: {present}/{len(files)} evidence items present")
              if gaps:
                  total_gaps += len(gaps)
                  for g in gaps:
                      print(f"    [GAP] {g}")

          print(f"\n  Total gaps: {total_gaps}")
          if total_gaps == 0:
              print("  STATUS: All required evidence present")
          else:
              print(f"  STATUS: {total_gaps} gap(s) require attention")
          print("=" * 60)
          GAP_ANALYSIS

  # ── Notification ───────────────────────────────────────────────────────
  notify:
    name: Notification
    needs: [collect, gap-analysis]
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.notify == 'true'
    steps:
      - name: Check for gaps
        run: |
          MISSING="${{ needs.collect.outputs.missing_count }}"
          COMPLETENESS="${{ needs.collect.outputs.completeness }}"
          GAP_RESULT="${{ needs.gap-analysis.result }}"

          echo "Evidence Collection Results:"
          echo "  Completeness: $COMPLETENESS"
          echo "  Missing items: $MISSING"
          echo "  Gap analysis: $GAP_RESULT"

          if [ "$MISSING" != "0" ] && [ -n "$MISSING" ]; then
            echo "::warning::Evidence collection has $MISSING missing item(s) — review required"
          fi

          if [ "$GAP_RESULT" == "failure" ]; then
            echo "::error::Evidence gap analysis failed — immediate attention required"
          fi
